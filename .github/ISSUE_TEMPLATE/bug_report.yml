name: Bug Report
description: Report an issue, dispatcher timeout, or unexpected error in freefire-like-api
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue.
        If this is an API key exposure or token security vulnerability, please do NOT use this form; refer to [SECURITY.md](https://github.com/itsgoharrehman/freefire-like-api/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact endpoint, parameters, or test conditions.
      placeholder: |
        1. Send POST request to `/api/v1/like?uid=12345678`
        2. Observe exception
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Python version, OS, Uvicorn version.
      placeholder: |
        - Python Version: 3.11.x
        - OS: Ubuntu 22.04 / Debian 12 / Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server Traceback
      description: Paste relevant traceback logs (ensure API keys and tokens are sanitized).